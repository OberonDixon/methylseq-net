[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "methylseqnet"
version = "0.0.1"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "biopython",
    "scikit-learn",
    "captum",
    "modisco-lite",
    "scipy",
    "gin-config",
    "nvidia-ml-py",
    "logomaker",
    "pysam",
    "pytest",
    "lightning",
    "h5py",
    "pyBigWig",
    "wandb>=0.21",
    "borzoi-pytorch",
    "umap-learn",
    "numpy<2.0.0",
    "psutil",
]

[tool.setuptools]
packages = {find = {}}