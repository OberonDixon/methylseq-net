[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "methylseqnet"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "biopython",
    "scikit-learn",
    "captum",
    "scipy",
    "gin-config",
    "nvidia-ml-py",
    "pysam",
    "lightning",
    "h5py",
    "pyBigWig",
    "wandb>=0.21",
    "borzoi-pytorch",
    "basenji2-pytorch>=0.1.2",
#    "numpy<2.0.0",
    "numpy",
    "psutil",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = {find = {}}

[tool.setuptools.package-data]
methylseqnet = ["configs/*.toml", "configs/*.toml.example"]

[project.scripts]
methylseqnet-train = "methylseqnet.train:cli"
methylseqnet-predict = "methylseqnet.predict:main"
methylseqnet-preprocess = "methylseqnet.preprocess:main"
methylseqnet-peaks = "methylseqnet.peaks:main"
methylseqnet-insert-motifs = "methylseqnet.motifs:main"